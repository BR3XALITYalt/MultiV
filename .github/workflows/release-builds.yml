name: Build and publish MultiV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multiv-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export RELEASE_TAGS="$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' || true)"
          python - <<'PY'
          import os
          import re

          versions = []
          for tag in os.environ.get("RELEASE_TAGS", "").splitlines():
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag.strip())
              if match:
                  versions.append(tuple(map(int, match.groups())))
          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"
          latest = max(
              versions,
              default=(0, 1, -1) if manual else (0, 1, 0),
          )
          if manual:
              version = f"{latest[0]}.{latest[1]}.{latest[2] + 1}"
              release_version = f"v{version}"
          else:
              version = f"{latest[0]}.{latest[1]}.{latest[2]}-dev.{os.environ['RUN_NUMBER']}"
              release_version = ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"app_version={version}\n")
              output.write(f"release_version={release_version}\n")
          print(f"Build version: {version}")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "Pillow>=10.0.0" "numpy>=1.26" "soundfile>=0.14.0" "av>=14.0.0"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libasound2-dev libportaudio2 portaudio19-dev libsndfile1 libsndfile1-dev \
            libgl1 libegl1 libxkbcommon-x11-0 libx11-xcb1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-image0 libxcb-render-util0 libxcb-xkb1 \
            libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0 libxcb-util1 \
            libpulse0 libspeechd2 libpcsclite1 \
            libnss3 libxss1 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 tk-dev tcl-dev

      - name: Install app and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Windows WebView backend dependency
        if: runner.os == 'Windows'
        run: python -m pip install pythonnet

      - name: Write packaged build metadata
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("build_info.py").write_text(
              '"""Build metadata generated by the release workflow."""\n'
              f"APP_VERSION = {os.environ['APP_VERSION']!r}\n"
              f"APP_BUILD_NUMBER = {int(os.environ['APP_BUILD_NUMBER'])}\n"
              f"APP_COMMIT = {os.environ['APP_COMMIT']!r}\n",
              encoding="utf-8",
          )
          PY

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --noconfirm --clean --windowed --onedir --name MultiV --add-data "assets;assets" --collect-all webview --collect-all av --collect-all numpy --collect-all soundfile --collect-all sounddevice --collect-all PIL --collect-all pyaudiowpatch --collect-all pystray --collect-all clr_loader --collect-all pythonnet --hidden-import clr main.py

          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $compilerPath = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compilerPath)) {
              choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compilerPath)) {
              throw "Inno Setup 6 compiler was not found."
          }

          $version = "${{ needs.prepare.outputs.app_version }}"
          $build = "${{ github.run_number }}"
          & $compilerPath "/DAppVersion=$version" "/DBuildNumber=$build" "MultiV.iss"
          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $filename = "MultiV-windows-x86_64-$build.exe"
          $output = Join-Path $PWD "release-out"
          $installerPath = Join-Path $output $filename
          if (-not (Test-Path $installerPath)) {
              throw "Inno Setup did not produce $filename."
          }
          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $filename" | Set-Content -NoNewline -Encoding ascii (Join-Path $output "$filename.sha256")

          # Install into a temporary folder and verify the optional desktop shortcut task.
          $installTest = Join-Path $env:RUNNER_TEMP "MultiV-Inno-Test"
          if (Test-Path $installTest) {
              Remove-Item $installTest -Recurse -Force
          }
          & $installerPath "/VERYSILENT" "/SUPPRESSMSGBOXES" "/NORESTART" "/SP-" "/DIR=$installTest" "/TASKS=desktopicon"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $installTest "MultiV.exe"))) {
              throw "The Inno Setup installer did not install MultiV correctly."
          }

          $desktopPaths = @(
              [Environment]::GetFolderPath("Desktop"),
              [Environment]::GetFolderPath("CommonDesktopDirectory")
          ) | Where-Object { $_ }
          $shortcut = $desktopPaths | ForEach-Object { Join-Path $_ "MultiV.lnk" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $shortcut) {
              throw "The desktop shortcut task did not create MultiV.lnk."
          }

          $appPath = Join-Path $installTest "MultiV.exe"
          $app = Start-Process -FilePath $appPath -WorkingDirectory $installTest -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited -and $app.ExitCode -ne 0) {
              throw "The installed Windows application exited with code $($app.ExitCode)."
          }
          if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
          }

          $uninstaller = Join-Path $installTest "unins000.exe"
          if (Test-Path $uninstaller) {
              Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          }
          foreach ($desktopPath in $desktopPaths) {
              Remove-Item (Join-Path $desktopPath "MultiV.lnk") -Force -ErrorAction SilentlyContinue
          }

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --windowed --onedir --name MultiV --add-data "assets:assets" --collect-all webview --collect-all qtpy --collect-all PyQt6 --collect-all PyQt6.QtWebEngineCore --collect-all PyQt6.QtWebEngineWidgets --collect-all av --collect-all numpy --collect-all soundfile --collect-all sounddevice --collect-all PIL main.py

          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a dist/MultiV/. "$APPDIR/usr/bin/"

          python - <<'PY'
          from PIL import Image
          image = Image.open("assets/logo.png").convert("RGBA")
          image.thumbnail((256, 256), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          canvas.alpha_composite(image, ((256-image.width)//2, (256-image.height)//2))
          canvas.save("AppDir/usr/share/icons/hicolor/256x256/apps/multiv.png")
          PY
          ln -s usr/share/icons/hicolor/256x256/apps/multiv.png "$APPDIR/.DirIcon"

          cat > "$APPDIR/usr/share/applications/multiv.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MultiV
          Comment=Desktop client for virtual radio simulators
          Exec=AppRun
          Icon=multiv
          Terminal=false
          Categories=AudioVideo;Audio;
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin/MultiV/_internal:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/MultiV" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          QXCB_PLUGIN="$(find "$APPDIR" -type f -name 'libqxcb.so' -print -quit)"
          WEBENGINE_PROCESS="$(find "$APPDIR" -type f -name 'QtWebEngineProcess' -print -quit)"
          DEPLOY_ARGS=(--appdir "$APPDIR" --executable "$APPDIR/usr/bin/MultiV")
          if [ -n "$QXCB_PLUGIN" ]; then DEPLOY_ARGS+=(--executable "$QXCB_PLUGIN"); fi
          if [ -n "$WEBENGINE_PROCESS" ]; then DEPLOY_ARGS+=(--executable "$WEBENGINE_PROCESS"); fi

          curl -fL --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage "${DEPLOY_ARGS[@]}" --desktop-file "$APPDIR/usr/share/applications/multiv.desktop" --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/multiv.png"

          curl -fL --retry 3 https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          build="${{ github.run_number }}"
          filename="MultiV-linux-x86_64-$build.AppImage"
          mkdir -p release-out
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "release-out/$filename"
          chmod +x "release-out/$filename"
          sha256sum "release-out/$filename" > "release-out/$filename.sha256"
          APPIMAGE_EXTRACT_AND_RUN=1 "release-out/$filename" --help >/tmp/multiv-appimage-help.txt

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiv-${{ matrix.platform }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: multiv-*
          path: release-out
          merge-multiple: true

      - name: Create update manifest
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          build = int(os.environ["APP_BUILD_NUMBER"])
          repository = os.environ["REPOSITORY"]
          files = {
              "windows-x86_64": f"MultiV-windows-x86_64-{build}.exe",
              "linux-x86_64": f"MultiV-linux-x86_64-{build}.AppImage",
          }
          assets = {}
          for platform, filename in files.items():
              path = Path("release-out") / filename
              if not path.is_file():
                  raise SystemExit(f"Missing platform build: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets[platform] = {
                  "filename": filename,
                  "url": f"https://github.com/{repository}/releases/download/rolling/{filename}",
                  "sha256": digest,
                  "size": path.stat().st_size,
              }
              Path(str(path) + ".sha256").write_text(f"{digest}  {filename}\n", encoding="ascii")
          manifest = {
              "channel": "rolling",
              "version": os.environ["APP_VERSION"],
              "build_number": build,
              "commit": os.environ["APP_COMMIT"],
              "assets": assets,
          }
          Path("release-out/multiv-update.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Move rolling tag to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/git/ref/tags/rolling" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/rolling" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/rolling" -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="MultiV rolling build $BUILD_NUMBER"
          notes="Automatic build $BUILD_NUMBER from commit $COMMIT. This prerelease is updated on every commit to main."
          if gh release view rolling --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit rolling --repo "$REPOSITORY" --title "$title" --notes "$notes" --prerelease
          else
            gh release create rolling --repo "$REPOSITORY" --title "$title" --notes "$notes" --prerelease --target "$COMMIT"
          fi
          gh release upload rolling --repo "$REPOSITORY" \
            release-out/MultiV-windows-x86_64-"$BUILD_NUMBER".exe \
            release-out/MultiV-windows-x86_64-"$BUILD_NUMBER".exe.sha256 \
            release-out/MultiV-linux-x86_64-"$BUILD_NUMBER".AppImage \
            release-out/MultiV-linux-x86_64-"$BUILD_NUMBER".AppImage.sha256 --clobber
          gh release upload rolling --repo "$REPOSITORY" release-out/multiv-update.json --clobber

          # Keep recent build assets available while clients finish downloading an older manifest.
          gh release view rolling --repo "$REPOSITORY" --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            if [[ "$asset" == "multiv-update.json" ]]; then
              continue
            fi
            if [[ "$asset" =~ ^MultiV-(windows-x86_64|linux-x86_64)-([0-9]+)\.(exe|AppImage)(\.sha256)?$ ]]; then
              asset_build="${BASH_REMATCH[2]}"
              if (( asset_build >= BUILD_NUMBER - 5 )); then
                continue
              fi
            fi
            gh release delete-asset rolling "$asset" --repo "$REPOSITORY" --yes
          done

      - name: Publish numbered release for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_VERSION" --repo "$REPOSITORY" \
            --title "MultiV $APP_VERSION" \
            --notes "MultiV $APP_VERSION. Build $BUILD_NUMBER from commit $COMMIT." \
            --target "$COMMIT" \
            release-out/MultiV-windows-x86_64-"$BUILD_NUMBER".exe \
            release-out/MultiV-windows-x86_64-"$BUILD_NUMBER".exe.sha256 \
            release-out/MultiV-linux-x86_64-"$BUILD_NUMBER".AppImage \
            release-out/MultiV-linux-x86_64-"$BUILD_NUMBER".AppImage.sha256 \
            release-out/multiv-update.json

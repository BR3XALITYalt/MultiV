name: Tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "Pillow>=10.0.0" "numpy>=1.26" "soundfile>=0.14.0"

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  drm-bridge-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TXITPY
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev

      - name: Check out pinned DecDRM source
        uses: actions/checkout@v7
        with:
          repository: CasualArclamp/DecDRM
          ref: 05845c9a754309b86d4985b25b1c3a787b988104
          path: decdrm
          submodules: recursive

      - name: Prepare the in-memory DRM bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("decdrm")
          plan = root / "crates/decdrm-station/src/plan.rs"
          text = plan.read_text(encoding="utf-8")
          check = (
              "    if out.file.is_none() && out.device.is_none() {\\n"
              "        p.push(\\"output: set \\u0060file\\u0060 and/or \\u0060device\\u0060\\");\\n"
              "    }"
          )
          marker = "TXITPY consumes the samples returned by Station::transmit_frame()"
          if check in text:
              plan.write_text(text.replace(check, "    // " + marker + "\\n", 1), encoding="utf-8")
          elif marker not in text:
              raise SystemExit("Pinned DecDRM output validation changed.")

          package = root / "apps/txitpy-drm-bridge"
          (package / "src").mkdir(parents=True, exist_ok=True)
          shutil.copyfile("drm_encoder/src/main.rs", package / "src/main.rs")
          (package / "Cargo.toml").write_text(
              "[package]\\n"
              'name = "txitpy-drm-bridge"\\n'
              'version = "0.1.0"\\n'
              "edition.workspace = true\\n"
              "license.workspace = true\\n"
              "repository.workspace = true\\n"
              "rust-version.workspace = true\\n\\n"
              "[dependencies]\\n"
              'decdrm-station = { path = "../../crates/decdrm-station" }\\n',
              encoding="utf-8",
          )
          PY

      - name: Build the DRM encoder
        working-directory: decdrm
        run: cargo build --release -p txitpy-drm-bridge

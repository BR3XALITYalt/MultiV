name: Tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "Pillow>=10.0.0" "numpy>=1.26" "soundfile>=0.14.0"

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  drm-bridge-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TXITPY
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev

      - name: Check out pinned DecDRM source
        uses: actions/checkout@v7
        with:
          repository: CasualArclamp/DecDRM
          ref: 05845c9a754309b86d4985b25b1c3a787b988104
          path: decdrm
          submodules: recursive

      - name: Prepare the in-memory DRM bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("decdrm")
          plan = root / "crates/decdrm-station/src/plan.rs"
          source = plan.read_text(encoding="utf-8")
          newline = chr(10)
          check = (
              "    if out.file.is_none() && out.device.is_none() {" + newline
              + '        p.push("output: set ' + chr(96) + 'file' + chr(96)
              + ' and/or ' + chr(96) + 'device' + chr(96) + '");' + newline
              + "    }"
          )
          marker = "TXITPY consumes the samples returned by Station::transmit_frame()"
          if check in source:
              plan.write_text(source.replace(check, "    // " + marker + chr(10), 1), encoding="utf-8")
          elif marker not in source:
              raise SystemExit("Pinned DecDRM output validation changed.")

          package = root / "apps/txitpy-drm-bridge"
          (package / "src").mkdir(parents=True, exist_ok=True)
          shutil.copyfile("drm_encoder/src/main.rs", package / "src/main.rs")
          manifest = """[package]
          name = "txitpy-drm-bridge"
          version = "0.1.0"
          edition.workspace = true
          license.workspace = true
          repository.workspace = true
          rust-version.workspace = true

          [dependencies]
          decdrm-station = { path = "../../crates/decdrm-station" }
          """
          package.joinpath("Cargo.toml").write_text(manifest.lstrip(), encoding="utf-8")
          PY

      - name: Build the DRM encoder
        working-directory: decdrm
        run: cargo build --release -p txitpy-drm-bridge

      - name: Validate the one-service 4.5 kHz configuration
        working-directory: decdrm
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          base = """[channel]
          mode = "B"
          occupancy = 0
          msc_mode = "64-QAM"
          sdc_mode = "4-QAM"
          interleaving = "short"
          protection_a = 0
          protection_b = 0

          [output]
          sample_format = "float32"
          format = "real"
          if_hz = 1500.0
          level_dbfs = -15.0
          band_limit = true

          [[service]]
          label = "TXITPY DRM"
          id = 0xB30001
          language = "English"
          programme_type = "Pop Music"

          [service.audio]
          codec = "he-aac"
          core_rate = 12000
          stereo = false
          part = "B"
          share = 1.0

          [service.audio.input]
          tone_hz = 1000.0
          level_dbfs = -12.0
          """

          for protection in range(4):
              config = base.replace(
                  "protection_b = 0",
                  f"protection_b = {protection}",
              )
              Path("drm-validation.toml").write_text(config, encoding="utf-8")
              result = subprocess.run(
                  [
                      "cargo", "run", "--release", "-q",
                      "-p", "txitpy-drm-bridge", "--",
                      "--check", "drm-validation.toml",
                  ],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              print(f"64-QAM protection_b={protection}:")
              if result.stdout:
                  print(result.stdout, end="")
              if result.stderr:
                  print(result.stderr, end="")
              if result.returncode == 0:
                  print(f"Selected 64-QAM protection_b={protection}.")
                  sys.exit(0)

          raise SystemExit("No tested 64-QAM protection level can carry the HE-AAC service.")
          PY
